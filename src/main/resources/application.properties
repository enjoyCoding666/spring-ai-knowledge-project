spring.application.name=spring-ai-knowledge-project
server.port=${SERVER_PORT:8082}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3:8b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.7}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.options.model=${DEEPSEEK_CHAT_MODEL:deepseek-chat}
spring.ai.deepseek.chat.options.temperature=${DEEPSEEK_TEMPERATURE:0.7}

# 同时存在 Ollama 和 DeepSeek 两个聊天模型时，手动为它们分别创建 ChatClient。
spring.ai.chat.client.enabled=false

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.vectorstore.pgvector.table-name=t_vector_store
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.initialize-schema=true

app.knowledge.chunk-min-size=${KNOWLEDGE_CHUNK_MIN_SIZE:300}
app.knowledge.chunk-max-size=${KNOWLEDGE_CHUNK_MAX_SIZE:1200}
app.knowledge.semantic-break-percentile=${KNOWLEDGE_SEMANTIC_BREAK_PERCENTILE:0.75}
app.knowledge.semantic-batch-size=${KNOWLEDGE_SEMANTIC_BATCH_SIZE:32}
app.knowledge.rerank.api-key=${COHERE_API_KEY:}
app.knowledge.rerank.model=rerank-v4.0-fast
app.knowledge.rerank.candidate-limit=${COHERE_RERANK_CANDIDATE_LIMIT:30}
app.knowledge.batch-size=${KNOWLEDGE_BATCH_SIZE:500}
app.knowledge.max-file-size=${KNOWLEDGE_MAX_FILE_SIZE:10485760}
